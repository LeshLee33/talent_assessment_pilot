# Правила подсчёта (план пилота, раздел 4). Предложение для согласования.
# Все пороги и веса движок читает ТОЛЬКО отсюда.

version: "0.1-draft"

scale:
  min: 1
  max: 5
  labels:
    1: "Не проявляется / неэффективное поведение"
    2: "Проявляется эпизодически"
    3: "Проявляется стабильно на базовом уровне"
    4: "Проявляется уверенно, в сложных ситуациях"
    5: "Образцовое поведение, может развивать других"

# Методы оценки и их группа
methods:
  sjt:           {name: "Ситуационный тест (SJT)",               group: behavioral}
  sim1:          {name: "Симуляция 1: сложный разговор с подчинённым", group: behavioral}
  sim2:          {name: "Симуляция 2: продвижение изменения",     group: behavioral}
  questionnaire: {name: "Опросник по компетенциям (самооценка)",  group: self_report}

# Веса групп методов в балле индикатора (сумма = 1.0)
group_weights:
  behavioral: 0.7
  self_report: 0.3

# Расхождение самооценки и поведенческой оценки (в уровнях шкалы),
# начиная с которого ставится флаг «завышенная / заниженная самооценка»
self_assessment_discrepancy_threshold: 1.5

# Минимальная доля оценённых индикаторов, чтобы компетенция считалась оценённой
min_assessed_indicator_share: 0.5

# Число знаков после запятой при округлении уровней
rounding: 2

# Категории по разрыву (факт − цель). Проверяются сверху вниз:
# первая категория, для которой gap >= min_gap, и есть результат.
# Последняя категория (min_gap: null) — всё, что ниже.
#   gap >= +0.5          → сильная сторона
#   -0.5 <  gap < +0.5   → соответствует требованиям
#   -1.5 <  gap <= -0.5  → зона развития
#   gap <= -1.5          → критичная зона развития
gap_categories:
  - id: strength
    name: "Сильная сторона"
    min_gap: 0.5
    inclusive: true
  - id: meets
    name: "Соответствует требованиям"
    min_gap: -0.5
    inclusive: false
  - id: development
    name: "Зона развития"
    min_gap: -1.5
    inclusive: false
  - id: critical
    name: "Критичная зона развития"
    min_gap: null

# Общий результат оценки (ДОПУЩЕНИЕ ПРОТОТИПА: в плане пилота правило не задано).
# Доля = (число компетенций в категориях strength/meets) / (число оценённых компетенций).
# Проверяется сверху вниз; наличие критичной зоны развития ограничивает результат
# уровнем не выше «partial».
overall_result:
  match_categories: [strength, meets]
  levels:
    - id: full
      name: "Профиль соответствует целевому"
      min_match_share: 0.8
    - id: partial
      name: "Частичное соответствие профилю"
      min_match_share: 0.5
    - id: low
      name: "Существенные разрывы с профилем"
      min_match_share: 0.0
  critical_category: critical
  cap_if_critical: partial
